<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Tickets{% endblock %}</title>
    <style>
        :root {
            --bg: #f3f6fb;
            --panel: #ffffff;
            --primary: #1f6feb;
            --primary-dark: #184ea6;
            --secondary: #ecf3ff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dfe7f3;
            --success: #1fa673;
            --warning: #dc8a00;
            --danger: #d94c4c;
            --shadow: 0 10px 28px rgba(17, 24, 39, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #edf4ff 0%, #f8fbff 100%);
            color: var(--text);
        }
        a { text-decoration: none; color: inherit; }
        .app-shell {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 18px 24px;
            margin-bottom: 24px;
        }
        .brand {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 0.04em;
        }
        .nav {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .nav-link,
        .btn, button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .nav-link {
            background: var(--secondary);
            color: var(--primary);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary {
            background: #eef2f7;
            color: var(--text);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 24px;
        }
        .hero {
            background: linear-gradient(135deg, #eff6ff, #ffffff);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 24px;
        }
        h1, h2, h3 { margin-top: 0; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }
        .card {
            background: #f9fbff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
        }
        .kpi {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 12px;
        }
        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            background: #e8f1ff;
            color: var(--primary-dark);
            margin-bottom: 10px;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        .table th, .table td {
            text-align: left;
            border-bottom: 1px solid var(--border);
            padding: 12px 10px;
            vertical-align: top;
        }
        .table th { background: #f6f9ff; }
        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .status.abierto { background: #eaf7ee; color: var(--success); }
        .status.en_proceso { background: #fff2db; color: var(--warning); }
        .status.pendiente { background: #fff4e8; color: #b86900; }
        .status.resuelto { background: #e8faff; color: #0d7a8a; }
        .status.cerrado { background: #f3f4f6; color: #4b5563; }
        .priority {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .priority.baja { background: #edfdf5; color: #138a52; }
        .priority.media { background: #fff8e6; color: #a86d00; }
        .priority.alta { background: #fff1f1; color: #b32626; }
        .priority.critica { background: #fce7f3; color: #9d174d; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 0.98rem;
            margin-bottom: 12px;
            font-family: inherit;
        }
        textarea { min-height: 110px; resize: vertical; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            border: 1px solid transparent;
        }
        .alert-success { background: #ebfff5; border-color: #c8f0d7; color: #17613d; }
        .alert-error { background: #fff0f0; border-color: #f6c8c8; color: #8a2f2f; }
        .muted { color: var(--muted); }
        .two-col {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 20px;
        }
        @media (max-width: 850px) {
            .two-col { grid-template-columns: 1fr; }
            .topbar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="topbar">
            <div class="brand">Sistema de tickets</div>
            {% if user.is_authenticated %}
                <div class="nav">
                    <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                    <a class="nav-link" href="{% url 'tickets' %}">Tickets</a>
                    <a class="btn btn-secondary" href="{% url 'ticket_create' %}">Nuevo ticket</a>
                    <a class="btn btn-primary" href="{% url 'logout' %}">Cerrar sesión</a>
                </div>
            {% endif %}
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'success' }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
